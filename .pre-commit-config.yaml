repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        # Run pyright through uv so it uses the project venv and can resolve
        # all installed packages. The pyright-python pre-commit hook runs in
        # an isolated environment without access to the venv, producing ~296
        # false-positive import errors for every project module.
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
