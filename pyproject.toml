[project]
name = "starcore-platform"
version = "0.1.0-dev"
description = "AI Powered Infrastructure Operating Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jakub Krajča", email = "jakubkrajca@volny.cz" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "typer>=0.17.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.42",
    "alembic>=1.16.0",
    "httpx>=0.28.1",
    "rich>=14.0.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "psutil>=7.0.0",
    "docker>=7.2.0",
    "proxmoxer>=2.3.0",
    "anthropic>=0.116.0",
    "slowapi>=0.1.10",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
    "pyright>=1.1.390",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.6.15,<10.0.0",
    "pip-audit>=2.10.1",
    "hypothesis>=6.135.0",
    "bandit>=1.8.0",
]

[project.scripts]
starcore = "apps.cli.main:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "apps",
    "packages/ai",
    "packages/core",
    "packages/blueprints",
    "packages/orchestrator",
    "packages/provider_sdk",
    "packages/providers",
]

[tool.hatch.build.targets.sdist]
include = [
    "apps",
    "packages",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    ".",
    "packages",
]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["packages", "apps"]
omit = ["*/static/*"]

[tool.coverage.report]
skip_empty = true

[tool.bandit]
# Accepted false positives in this codebase:
#
# B101 assert-used: all assert statements in providers are type-narrowing
#   invariants (assert self._client is not None) in non-public code paths;
#   they're unreachable without a prior successful connect() call.  Python -O
#   is never used to run this service in practice.
#
# B104 hardcoded-bind-all-interfaces: api_host defaults to 0.0.0.0 which is
#   intentional and documented for containerised deployment (Docker/Compose).
#   Operators restrict network exposure at the host/firewall layer.
#
# B404 import-subprocess, B603 subprocess-without-shell-equals-true, B607
#   start-process-with-partial-path: every subprocess.run call uses a
#   hardcoded constant list (never shell=True); "uv"/"git"/"ruff" are
#   well-known tools resolved via PATH — no injection surface.
skips = ["B101", "B104", "B404", "B603", "B607"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
