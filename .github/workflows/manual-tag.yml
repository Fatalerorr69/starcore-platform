name: Manual Tag

# Creates a git tag on main and explicitly dispatches release.yml.
# GITHUB_TOKEN-triggered tag pushes do not re-trigger other workflows (GitHub
# Actions security model), so release.yml is dispatched via workflow_dispatch.
# Usage: Actions → Manual Tag → Run workflow → enter version (e.g. v0.6.0)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create (e.g. v0.6.0)'
        required: true
        default: 'v0.6.0'

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard against duplicate tags
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $TAG already exists — aborting to prevent overwrite"
            exit 1
          fi

      - name: Create and push tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch release workflow
        run: |
          gh workflow run release.yml --ref main --field tag_name="${{ github.event.inputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
