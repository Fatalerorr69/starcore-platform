name: STARCORE Integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  integrity:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Python check
      run: |
        python --version
        python -m compileall core platform || true


    - name: Repository health
      run: |
        git status
        git log --oneline -5


    - name: Security files
      run: |
        find security -type f || true

