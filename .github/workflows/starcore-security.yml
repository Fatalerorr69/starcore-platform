name: STARCORE Security

on:

  schedule:
    - cron: "0 5 * * *"

  workflow_dispatch:


jobs:

 security:

  runs-on: ubuntu-latest


  steps:

  - name: Checkout
    uses: actions/checkout@v4


  - name: Secret scan
    uses: gitleaks/gitleaks-action@v2
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  - name: File audit
    run: |
      find . -name "*.pyc"
      find . -name "__pycache__"

