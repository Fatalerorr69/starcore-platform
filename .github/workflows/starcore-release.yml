name: STARCORE Release Check


on:

 workflow_dispatch:


jobs:

 release:

  runs-on: ubuntu-latest


  steps:

  - name: Checkout
    uses: actions/checkout@v4


  - name: Release validation
    run: |

      echo "STARCORE RELEASE"

      git status

      git branch

      git log --oneline -5

      du -sh .


