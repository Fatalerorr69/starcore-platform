name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lockfile consistency check
        run: uv lock --check

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: pip-audit (dependency vulnerability scan)
        run: uv run pip-audit

      - name: Bandit SAST (medium+ severity)
        run: uv run bandit -r packages/ apps/ scripts/ -ll -q

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pytest
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=100

      - name: Alembic check (detect un-migrated model changes)
        run: |
          STARCORE_DATABASE_URL=sqlite:///./ci-check.db uv run alembic upgrade head
          STARCORE_DATABASE_URL=sqlite:///./ci-check.db uv run alembic check

      - name: Documentation build (mkdocs --strict)
        run: uv run mkdocs build --strict

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -t starcore-platform:ci-test .

      - name: Smoke test container starts and responds to /health
        run: |
          docker run -d --name starcore-ci -p 8000:8000 \
            -e STARCORE_DATABASE_URL=sqlite:////data/starcore.db \
            starcore-platform:ci-test
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after retries"
          docker logs starcore-ci
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs starcore-ci || true
