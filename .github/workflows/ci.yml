name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lockfile consistency check
        run: uv lock --check

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: pip-audit (dependency vulnerability scan)
        run: uv run pip-audit

      - name: Bandit SAST (medium+ severity)
        run: uv run bandit -r packages/ apps/ scripts/ -ll -q

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: platform/.gitleaks.toml

      - name: Pytest
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=100

      - name: Alembic check (detect un-migrated model changes)
        run: |
          STARCORE_DATABASE_URL=sqlite:///./ci-check.db uv run alembic upgrade head
          STARCORE_DATABASE_URL=sqlite:///./ci-check.db uv run alembic check

      - name: Documentation build (mkdocs --strict)
        run: uv run mkdocs build --strict

      - name: Changelog gate (Unreleased must be non-empty)
        if: |
          !startsWith(github.event.pull_request.title, 'chore: release') &&
          !startsWith(github.event.head_commit.message, 'chore: release')
        run: uv run python scripts/release.py check-changelog

  postgres-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: starcore_test
          POSTGRES_USER: starcore
          POSTGRES_PASSWORD: starcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (including psycopg2-binary)
        run: uv sync --extra dev

      - name: Alembic migration check (PostgreSQL dialect)
        env:
          STARCORE_DATABASE_URL: postgresql://starcore:starcore_test@localhost:5432/starcore_test
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: PostgreSQL smoke tests
        env:
          STARCORE_TEST_POSTGRES_URL: postgresql://starcore:starcore_test@localhost:5432/starcore_test
          STARCORE_API_KEY: smoke-test-key
        run: uv run pytest tests/postgres/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -t starcore-platform:ci-test ./platform

      - name: Smoke test container starts and responds to /health
        run: |
          docker run -d --name starcore-ci -p 8000:8000 \
            -e STARCORE_DATABASE_URL=sqlite:////data/starcore.db \
            starcore-platform:ci-test
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after retries"
          docker logs starcore-ci
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs starcore-ci || true
