name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lockfile consistency check
        run: uv lock --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: pip-audit (dependency vulnerability scan)
        run: uv run pip-audit

      - name: Bandit SAST (medium+ severity)
        run: uv run bandit -r packages/ apps/ scripts/ -ll -q

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pytest
        run: uv run pytest -q --tb=short --cov --cov-report=term-missing --cov-fail-under=100

      - name: Alembic check (detect un-migrated model changes)
        run: |
          STARCORE_DATABASE_URL=sqlite:///./ci-check.db uv run alembic upgrade head
          STARCORE_DATABASE_URL=sqlite:///./ci-check.db uv run alembic check

      - name: Documentation build (mkdocs --strict)
        run: uv run mkdocs build --strict

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("starcore-platform"))')"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "ERROR: tag $TAG != pyproject.toml version $PKG"
            exit 1
          fi
          echo "Version check passed: $TAG"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d;' > release-notes.txt
          if [[ ! -s release-notes.txt ]]; then
            echo "ERROR: no release notes found in CHANGELOG.md for version $VERSION"
            exit 1
          fi
          echo "Release notes extracted:"
          cat release-notes.txt

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "STARCORE Platform $GITHUB_REF_NAME" \
            --notes-file release-notes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
